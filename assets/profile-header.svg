      <stop stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#10223B"/>
      <stop offset="1" stop-color="#0B5F65"/>
    </linearGradient>
    <linearGradient id="accent" x1="170" y1="92" x2="726" y2="92" gradientUnits="userSpaceOnUse">
