<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Umay Samli — AI Security</title>
  <desc id="description">A teal and navy profile banner for AI security researcher and software engineer Umay Samli.</desc>

  <defs>
