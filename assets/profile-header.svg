  <rect x="69" y="160" width="555" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="69" y="205" fill="#CCFBF1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="550" letter-spacing="1.2">AI SECURITY · CYBERSECURITY</text>
